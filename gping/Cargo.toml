[package]
name = "gping"
version = "1.21.0"
authors = ["Tom Forbes <tom@tomforb.es>"]
edition = "2018"
rust-version = "1.88"
repository = "https://github.com/orf/gping"
license = "MIT"
description = "Ping, but with a graph."
readme = "../readme.md"

[dependencies]
pinger = { version = "^2.2.0", path = "../pinger" }
tui = { package = "ratatui", version = "0.30.2", features = ["crossterm"], default-features = false }
anyhow = "1.0.101"
chrono = "0.4.43"
clap = { version = "4.5.57", features = ["derive"] }
clap_mangen = "0.3.0"
idna = "1.1.0"
clap-cargo = "0.19.0"

[target.'cfg(unix)'.dependencies]
# Turns SIGTERM/SIGINT/SIGHUP into an orderly quit, so the terminal is restored.
signal-hook = "0.3.18"
# With stdin redirected (`xargs gping`, `gping host < /dev/null`) crossterm reads keys from
# /dev/tty, which its default kqueue-based reader can't watch on macOS: every key, Ctrl-C
# included, was ignored. `use-dev-tty` reads it with poll(2) instead.
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
